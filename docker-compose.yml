services:
  browser-agent:
    build: .
    container_name: browser-agent
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash-0731:free}
      - ALLOWED_DOMAINS=${ALLOWED_DOMAINS:-*}
      - HEADLESS=true
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
      - ./.sessions:/app/.sessions
      - ./screenshots:/app/screenshots
    restart: unless-stopped
