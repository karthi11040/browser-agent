<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autonomous Agent Test Lab</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; font-weight: bold; }
    input[type="text"], select { width: 100%; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0052a3; }
    .btn-danger { background: #cc0000; }
    .card { border: 1px solid #ddd; padding: 1.5rem; border-radius: 8px; margin-top: 1rem; }
    #search-results { margin-top: 1rem; padding: 1rem; background: #e6f7ff; border-left: 4px solid #1890ff; display: none; }
    dialog { border: 1px solid #ccc; border-radius: 8px; padding: 20px; }
  </style>
</head>
<body>
  <h1>Agent Automation Test Suite</h1>
  <p>Test fixture for accessibility snapshots, bounding-box clicks, and forms.</p>

  <div class="card">
    <h2>Search Section</h2>
    <div class="form-group">
      <label for="search-input">Search Query</label>
      <input id="search-input" type="text" placeholder="Type search term..." />
    </div>
    <button id="search-btn">Perform Search</button>
    <div id="search-results">
      <h3>Search Results</h3>
      <p id="results-text">Found 3 matching items for your query.</p>
    </div>
  </div>

  <div class="card">
    <h2>User Profile Form</h2>
    <form id="profile-form" onsubmit="event.preventDefault(); document.getElementById('form-status').innerText = 'Profile Saved Successfully!';">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label for="user-role">Role</label>
        <select id="user-role">
          <option value="user">Standard User</option>
          <option value="admin">Administrator</option>
          <option value="developer">Developer</option>
        </select>
      </div>
      <div class="form-group">
        <label>
          <input id="newsletter" type="checkbox" /> Subscribe to newsletter
        </label>
      </div>
      <button id="save-profile-btn" type="submit">Save Profile</button>
      <div id="form-status" style="margin-top: 0.5rem; color: green; font-weight: bold;"></div>
    </form>
  </div>

  <div class="card">
    <h2>Dangerous Actions</h2>
    <button id="delete-btn" class="btn-danger">Delete Account</button>
  </div>

  <dialog id="test-dialog">
    <h3>Confirmation Dialog</h3>
    <p>This is a test modal dialog.</p>
    <button id="close-dialog-btn" onclick="document.getElementById('test-dialog').close()">Close Dialog</button>
  </dialog>

  <script>
    document.getElementById('search-btn').addEventListener('click', () => {
      const q = document.getElementById('search-input').value;
      const res = document.getElementById('search-results');
      const text = document.getElementById('results-text');
      text.innerText = 'Search results for: ' + q;
      res.style.display = 'block';
    });
  </script>
</body>
</html>
